name: child_tracker
description: تطبيق حماية الأطفال - تتبع دقيق مع مزامنة دون اتصال
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # خدمة الخلفية - المكتبة الرسمية والموثوقة
  flutter_foreground_task: ^8.17.0
  # تحديد الموقع
  geolocator: ^13.0.1
  # المزامنة مع Supabase
  supabase_flutter: ^2.8.0
  # قاعدة البيانات المحلية
  sqflite: ^2.4.1
  path: ^1.9.0
  # أدوات مساعدة
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.0
  battery_plus: ^6.0.3
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.1
  device_info_plus: ^11.2.0
  uuid: ^4.5.1
  http: ^1.2.2
  intl: ^0.19.0

dependency_overrides:
  app_links: 6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
