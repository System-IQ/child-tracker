name: Build Child Tracker APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create Flutter project structure
        run: |
          cd /tmp
          flutter create --org com.systemiq --project-name child_tracker --platforms=android child_tracker_scaffold
          # نسخ ملفاتنا المخصصة فوق الهيكل
          cp ~/work/child-tracker/child-tracker/android_app/pubspec.yaml child_tracker_scaffold/pubspec.yaml
          rm -rf child_tracker_scaffold/lib
          cp -r ~/work/child-tracker/child-tracker/android_app/lib child_tracker_scaffold/lib
          cp ~/work/child-tracker/child-tracker/android_app/android/app/src/main/AndroidManifest.xml child_tracker_scaffold/android/app/src/main/AndroidManifest.xml
          echo "PROJECT_PATH=/tmp/child_tracker_scaffold" >> $GITHUB_ENV

      - name: Get dependencies
        run: |
          cd $PROJECT_PATH
          flutter pub get

      - name: Build APK
        run: |
          cd $PROJECT_PATH
          flutter build apk --release \
            --target-platform android-arm64 \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: child-tracker-apk
          path: /tmp/child_tracker_scaffold/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
